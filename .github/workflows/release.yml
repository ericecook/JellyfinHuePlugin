name: Release Plugin

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Get version from build.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' build.yaml | sed 's/version: *"\(.*\)"/\1/')
          [ -n "$VERSION" ] || { echo "No version found in build.yaml" >&2; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The zip is labelled with the build.yaml version and the manifest entry with the
      # release tag; a mismatch would ship one under the other. deploy.sh keeps them in
      # step, but a hand-made release would not.
      - name: Check the tag matches build.yaml
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Release tag $TAG does not match build.yaml version $VERSION" >&2
            exit 1
          fi

      - name: Test
        run: dotnet test -c Release

      - name: Build plugin
        run: dotnet publish JellyfinHuePlugin/JellyfinHuePlugin.csproj -c Release -o ./output -p:AssemblyVersion=${{ steps.version.outputs.version }} -p:FileVersion=${{ steps.version.outputs.version }}

      - name: Package plugin
        run: |
          cd output
          zip -r "../JellyfinHuePlugin_${{ steps.version.outputs.version }}.zip" ./*

      - name: Generate checksum
        run: |
          md5sum "JellyfinHuePlugin_${{ steps.version.outputs.version }}.zip" > "JellyfinHuePlugin_${{ steps.version.outputs.version }}.md5"

      - name: Upload release assets
        if: github.event_name == 'release'
        uses: shogo82148/actions-upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: |
            JellyfinHuePlugin_${{ steps.version.outputs.version }}.zip
            JellyfinHuePlugin_${{ steps.version.outputs.version }}.md5

  update-manifest:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - name: Generate manifest and publish to gh-pages
        uses: Kevinjil/jellyfin-plugin-repo-action@v0.4.3
        with:
          githubToken: ${{ github.token }}
          repository: ${{ github.repository }}
          pagesFile: manifest.json
